name: Requirements Compliance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shaders:
    name: Compile Vulkan shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslc spirv-tools

      - name: Compile and validate SPIR-V
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d2s-shaders"
          for source in src/desktop2stereo/shaders/*.comp src/desktop2stereo/shaders/*.vert src/desktop2stereo/shaders/*.frag; do
            output="$RUNNER_TEMP/d2s-shaders/$(basename "${source%.comp}").spv"
            glslc -std=450 "$source" -o "$output"
            spirv-val "$output"
          done

      - name: Validate shader manifest
        run: python src/tools/validate_shader_manifest.py

  matrix:
    name: Requirements matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install matrix test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest numpy pillow opencv-python-headless pyopenxr vulkan pyyaml truststore==0.10.4
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate requirements traceability
        run: python src/tools/check_compliance.py

      - name: Test requirements traceability
        env:
          PYTHONPATH: src/desktop2stereo
        run: python -m pytest -q tests/test_requirements_matrix.py

      - name: Prepare headless display settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('src/desktop2stereo/settings.yaml')
          settings = yaml.safe_load(path.read_text(encoding='utf-8'))
          # GitHub-hosted Linux runners have no physical monitor. Keep the
          # normal settings schema, but remove workstation-specific identity
          # records so import-time scaffold tests use the fallback index.
          settings.pop('Monitor Identity', None)
          settings.pop('Stereo Output Identity', None)
          path.write_text(yaml.safe_dump(settings, allow_unicode=True, sort_keys=False), encoding='utf-8')
          PY

      - name: Test Vulkan runtime scaffold
        env:
          PYTHONPATH: src/desktop2stereo
        run: >-
          python -m pytest -q
          tests/test_migration_scaffold.py
          tests/test_vulkan_runtime.py
          tests/test_shader_manifest.py
          tests/test_vulkan_interop.py
          tests/test_cuda_vulkan_interop.py
          tests/test_vulkan_resources.py
          tests/test_output_contract.py
          tests/test_runtime_output.py
          tests/test_runtime.py
          tests/test_pipeline.py
          tests/test_vulkan_stereo_pass.py
          tests/test_vulkan_backend_ring.py
          tests/test_vulkan_runtime_integration.py
          tests/test_openxr_vulkan.py
