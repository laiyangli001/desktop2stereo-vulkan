name: Verify protected core integration

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/stage-protected-core.py"
      - "src/desktop2stereo/auth/core.py"
      - "src/desktop2stereo/app_runtime/bootstrap.py"
      - "src/desktop2stereo/stereo_runtime/parallax.py"
      - "tests/test_protected_core.py"
      - ".github/workflows/protected-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      D2S_CORE_REPO_TOKEN: ${{ secrets.D2S_CORE_REPO_TOKEN }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Checkout private core assets
        if: env.D2S_CORE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: laiyangli001/desktop2stereo-vulkan-core
          token: ${{ env.D2S_CORE_REPO_TOKEN }}
          path: private-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protected-core verification dependencies
        run: python -m pip install cryptography pytest PyYAML truststore httpx flet numpy

      - name: Stage encrypted resource and verify manifest
        if: env.D2S_CORE_REPO_TOKEN != ''
        run: python scripts/stage-protected-core.py --private-core private-core

      - name: Verify protected-core contracts
        run: >-
          python -m pytest -q
          tests/test_protected_core.py
          tests/test_auth.py

      - name: Verify staged resource is encrypted-only
        if: env.D2S_CORE_REPO_TOKEN != ''
        shell: bash
        run: |
          test -f src/desktop2stereo/protected/parallax-core.enc
          ! grep -a -q 'PARALLAX_RESOLVER_VERSION' src/desktop2stereo/protected/parallax-core.enc

      - name: Report private-core integration status
        if: env.D2S_CORE_REPO_TOKEN == ''
        run: echo "D2S_CORE_REPO_TOKEN is not configured; private-core staging was skipped."
