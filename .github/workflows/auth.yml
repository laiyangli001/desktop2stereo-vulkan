name: Authorization checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/desktop2stereo/auth/**'
      - 'src/desktop2stereo/app_runtime/bootstrap.py'
      - 'tests/test_auth.py'
      - 'scripts/smoke/d2s_auth_contract_smoke.py'
      - 'tests/test_d2s_auth_contract_smoke.py'
      - 'tests/test_runtime_callbacks.py'
      - 'tests/test_runtime_entry.py'
      - 'tests/test_native_launcher.py'
      - 'tests/test_release_package_manifest.py'
      - 'tests/test_release_sbom.py'
      - 'tests/test_release_secrets.py'
      - 'scripts/install-public-key.mjs'
      - 'scripts/write-release-manifest.mjs'
      - 'scripts/write-release-sbom.mjs'
      - 'scripts/write-build-info.mjs'
      - 'scripts/verify-release-package.mjs'
      - 'scripts/scan-release-secrets.mjs'
      - 'scripts/stage-python-runtime.py'
      - 'tests/test_python_runtime_staging.py'
      - 'tests/conftest.py'
      - '.github/workflows/auth.yml'
  pull_request:
    paths:
      - 'src/desktop2stereo/auth/**'
      - 'src/desktop2stereo/app_runtime/bootstrap.py'
      - 'tests/test_auth.py'
      - 'scripts/smoke/d2s_auth_contract_smoke.py'
      - 'tests/test_d2s_auth_contract_smoke.py'
      - 'tests/test_runtime_callbacks.py'
      - 'tests/test_runtime_entry.py'
      - 'tests/test_native_launcher.py'
      - 'tests/test_release_package_manifest.py'
      - 'tests/test_release_sbom.py'
      - 'tests/test_release_secrets.py'
      - 'scripts/install-public-key.mjs'
      - 'scripts/write-release-manifest.mjs'
      - 'scripts/write-release-sbom.mjs'
      - 'scripts/write-build-info.mjs'
      - 'scripts/verify-release-package.mjs'
      - 'scripts/scan-release-secrets.mjs'
      - 'scripts/stage-python-runtime.py'
      - 'tests/test_python_runtime_staging.py'
      - 'tests/conftest.py'
      - '.github/workflows/auth.yml'

permissions:
  contents: read

jobs:
  client:
    name: Client authorization and launcher tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install authorization test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx flet pyyaml cryptography truststore numpy glfw soundcard

      - name: Install Windows authorization test dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywin32

      - name: Test authorization and native launcher contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_auth.py tests/test_d2s_auth_contract_smoke.py tests/test_runtime_callbacks.py tests/test_runtime_entry.py tests/test_native_launcher.py tests/test_python_runtime_staging.py tests/test_release_package_manifest.py tests/test_release_sbom.py tests/test_release_secrets.py

      - name: Compile authorization modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = list(Path("src/desktop2stereo/auth").rglob("*.py"))
          files.append(Path("src/desktop2stereo/app_runtime/bootstrap.py"))
          for path in files:
              py_compile.compile(str(path), doraise=True)
          PY
