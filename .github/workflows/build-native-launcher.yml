name: Build native launchers

on:
  workflow_dispatch:
    inputs:
      scan_only:
        description: "Only scan artifacts from an existing workflow run"
        required: false
        type: boolean
        default: false
      artifact_run_id:
        description: "Existing Actions run ID to scan when scan_only is enabled"
        required: false
        type: string
      artifact_sha:
        description: "Commit SHA used in the existing artifact names"
        required: false
        type: string
  push:
    paths:
      - "native/launcher/**"
      - ".github/workflows/build-native-launcher.yml"

jobs:
  windows-launcher:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.scan_only }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify application icon assets
        shell: pwsh
        run: |
          $icon = "src/desktop2stereo/icon/icon-256x256.ico"
          if (-not (Test-Path -LiteralPath $icon)) { throw "Application icon asset was not found: $icon" }

      - name: Configure
        run: cmake -S native/launcher/windows -B build/native-launcher -A x64

      - name: Build
        run: cmake --build build/native-launcher --config Release --parallel

      - name: Verify native launcher
        shell: pwsh
        run: |
          if (-not (Test-Path build/native-launcher/Release/Desktop2Stereo.exe)) { throw "Native launcher was not built." }

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v7
        with:
          name: Desktop2Stereo-windows-launcher-${{ github.sha }}
          path: build/native-launcher/Release/Desktop2Stereo.exe
          if-no-files-found: error

  linux-launcher:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.scan_only }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install launcher dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libpng-dev pkg-config

      - name: Configure
        run: cmake -S native/launcher/linux -B build/native-launcher-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native-launcher-linux --parallel

      - name: Verify native launcher
        run: |
          test -f build/native-launcher-linux/Desktop2Stereo

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v7
        with:
          name: Desktop2Stereo-linux-launcher-${{ github.sha }}
          path: build/native-launcher-linux/Desktop2Stereo
          if-no-files-found: error

  macos-launcher:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.scan_only }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure universal build
        run: cmake -S native/launcher/macos -B build/native-launcher-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build/native-launcher-macos --config Release --parallel

      - name: Verify native launcher
        run: |
          test -f build/native-launcher-macos/Desktop2Stereo-macos

      - name: Upload macOS launcher
        uses: actions/upload-artifact@v7
        with:
          name: Desktop2Stereo-macos-launcher-${{ github.sha }}
          path: build/native-launcher-macos/Desktop2Stereo-macos
          if-no-files-found: error

  malware-scan:
    name: Scan packaged launchers for malware
    needs: [windows-launcher, linux-launcher, macos-launcher]
    if: ${{ always() && (inputs.scan_only || (needs.windows-launcher.result == 'success' && needs.linux-launcher.result == 'success' && needs.macos-launcher.result == 'success')) }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Desktop2Stereo-*-launcher-${{ inputs.artifact_sha || github.sha }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Install ClamAV
        run: sudo apt-get update && sudo apt-get install -y clamav clamav-freshclam

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          freshclam_log=/var/log/clamav/desktop2stereo-freshclam.log
          sudo install -d -o clamav -g clamav -m 755 /var/log/clamav
          sudo install -o clamav -g clamav -m 664 /dev/null "$freshclam_log"
          sudo freshclam --stdout --verbose --log="$freshclam_log"
          sudo cat "$freshclam_log"

      - name: Scan final release artifacts
        run: |
          find artifacts -type f -print0 |
            xargs -0 -r sudo clamscan --infected --no-summary
