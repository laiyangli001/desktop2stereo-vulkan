name: Build native launchers

on:
  workflow_dispatch:
  push:
    paths:
      - "native/launcher/**"
      - "src/desktop2stereo/auth/**"
      - "src/desktop2stereo/app_runtime/**"
      - "src/desktop2stereo/icon/**"
      - "src/desktop2stereo/main.py"
      - "src/env_install/requirements*.txt"
      - "scripts/install-public-key.mjs"
      - "scripts/write-release-manifest.mjs"
      - "scripts/verify-release-package.mjs"
      - "scripts/scan-release-secrets.mjs"
      - "scripts/write-release-sbom.mjs"
      - "scripts/write-build-info.mjs"
      - "scripts/stage-python-runtime.py"
      - "tests/test_release_package_manifest.py"
      - "tests/test_release_sbom.py"
      - "tests/test_release_secrets.py"
      - "tests/test_python_runtime_staging.py"
      - ".github/workflows/build-native-launcher.yml"

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S native/launcher/windows -B build/native-launcher -A x64

      - name: Build
        run: cmake --build build/native-launcher --config Release --parallel

      - name: Set up packaging Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: src/env_install/requirements*.txt

      - name: Package launcher
        shell: pwsh
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          if (-not $env:D2S_LICENSE_PUBLIC_KEY_JSON) { throw "Repository variable D2S_LICENSE_PUBLIC_KEY_JSON is required for release packaging." }
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          New-Item -ItemType Directory -Force -Path dist/Desktop2Stereo/src/desktop2stereo | Out-Null
          Copy-Item build/native-launcher/Release/Desktop2Stereo.exe dist/Desktop2Stereo/src/
          Copy-Item src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          Copy-Item src/desktop2stereo/app_runtime,src/desktop2stereo/auth,src/desktop2stereo/gui,src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/ -Recurse
          Copy-Item src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          Copy-Item src/desktop2stereo/icon dist/Desktop2Stereo/src/desktop2stereo/ -Recurse
          Copy-Item native/launcher/windows/README.md dist/Desktop2Stereo/
          node scripts/write-build-info.mjs dist/Desktop2Stereo
          $runtimeUrl = "https://www.nuget.org/api/v2/package/python/3.12.10"
          $runtimeArchive = Join-Path $env:RUNNER_TEMP "python-3.12.10-nuget.zip"
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeArchive
          python scripts/stage-python-runtime.py windows $runtimeArchive dist/Desktop2Stereo/src/python3 --package-root dist/Desktop2Stereo --source-url $runtimeUrl --sha256 0eb85c2dfccccf1b17352de4c397f69194035b7d37149eacc16f1147d93de3b8 --expected-version 3.12.10
          $runtimePython = (Resolve-Path dist/Desktop2Stereo/src/python3/python.exe).Path
          & $runtimePython -m pip install --disable-pip-version-check --no-input --prefer-binary --no-compile --no-warn-script-location --timeout 120 --retries 3 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          if ($LASTEXITCODE -ne 0) { throw "Failed to install the Windows CPU PyTorch wheel." }
          & $runtimePython -m pip install --disable-pip-version-check --no-input --prefer-binary --no-compile --no-warn-script-location --timeout 120 --retries 3 -r src/env_install/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Failed to install locked release dependencies." }
          node scripts/write-release-sbom.mjs dist/Desktop2Stereo/sbom.cdx.json src/env_install/requirements.txt
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo
          node scripts/verify-release-package.mjs dist/Desktop2Stereo windows
          node scripts/scan-release-secrets.mjs dist/Desktop2Stereo

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v6
        with:
          name: Desktop2Stereo-windows-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo

  linux-launcher:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install launcher dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libpng-dev pkg-config

      - name: Configure
        run: cmake -S native/launcher/linux -B build/native-launcher-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native-launcher-linux --parallel

      - name: Set up packaging Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: src/env_install/requirements*.txt

      - name: Package launcher
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          test -n "$D2S_LICENSE_PUBLIC_KEY_JSON"
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          mkdir -p dist/Desktop2Stereo/src/desktop2stereo
          cp build/native-launcher-linux/Desktop2Stereo dist/Desktop2Stereo/src/
          cp src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/app_runtime src/desktop2stereo/auth src/desktop2stereo/gui src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/
          cp src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/icon dist/Desktop2Stereo/src/desktop2stereo/
          cp native/launcher/linux/README.md dist/Desktop2Stereo/
          node scripts/write-build-info.mjs dist/Desktop2Stereo
          runtime_url="https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          runtime_archive="$RUNNER_TEMP/python-3.12.14-linux.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 "$runtime_url" --output "$runtime_archive"
          python scripts/stage-python-runtime.py linux "$runtime_archive" dist/Desktop2Stereo/src/python3 --package-root dist/Desktop2Stereo --source-url "$runtime_url" --sha256 72748da13197c1fb161e3afeef20a6a385ff24f2165e6e2758e47008e7faba4c --expected-version 3.12.14
          dist/Desktop2Stereo/src/python3/bin/python -m pip install --disable-pip-version-check --no-input --prefer-binary --no-compile --no-warn-script-location --timeout 120 --retries 3 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch
          dist/Desktop2Stereo/src/python3/bin/python -m pip install --disable-pip-version-check --no-input --prefer-binary --no-compile --no-warn-script-location --timeout 120 --retries 3 -r src/env_install/requirements.txt
          node scripts/write-release-sbom.mjs dist/Desktop2Stereo/sbom.cdx.json src/env_install/requirements.txt
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo
          node scripts/verify-release-package.mjs dist/Desktop2Stereo linux
          node scripts/scan-release-secrets.mjs dist/Desktop2Stereo

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v6
        with:
          name: Desktop2Stereo-linux-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo

  macos-launcher:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure universal build
        run: cmake -S native/launcher/macos -B build/native-launcher-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build/native-launcher-macos --config Release --parallel

      - name: Set up packaging Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: src/env_install/requirements*.txt

      - name: Package launcher
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          test -n "$D2S_LICENSE_PUBLIC_KEY_JSON"
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          mkdir -p dist/Desktop2Stereo/src/desktop2stereo
          cp build/native-launcher-macos/Desktop2Stereo-macos dist/Desktop2Stereo/src/
          cp src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/app_runtime src/desktop2stereo/auth src/desktop2stereo/gui src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/
          cp src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/icon dist/Desktop2Stereo/src/desktop2stereo/
          cp native/launcher/macos/README.md dist/Desktop2Stereo/
          node scripts/write-build-info.mjs dist/Desktop2Stereo
          runtime_url="https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-aarch64-apple-darwin-install_only_stripped.tar.gz"
          runtime_archive="$RUNNER_TEMP/python-3.12.14-macos-arm64.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 "$runtime_url" --output "$runtime_archive"
          python scripts/stage-python-runtime.py macos "$runtime_archive" dist/Desktop2Stereo/src/python3 --package-root dist/Desktop2Stereo --source-url "$runtime_url" --sha256 81a359f1cfadd4da11766534c5913791cea55f26e1bb902cacd2a531bb1e4b2b --expected-version 3.12.14
          dist/Desktop2Stereo/src/python3/bin/python -m pip install --disable-pip-version-check --no-input --prefer-binary --no-compile --no-warn-script-location --timeout 120 --retries 3 -r src/env_install/requirements.txt
          node scripts/write-release-sbom.mjs dist/Desktop2Stereo/sbom.cdx.json src/env_install/requirements.txt
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo
          node scripts/verify-release-package.mjs dist/Desktop2Stereo macos
          node scripts/scan-release-secrets.mjs dist/Desktop2Stereo

      - name: Upload macOS launcher
        uses: actions/upload-artifact@v6
        with:
          name: Desktop2Stereo-macos-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo

  malware-scan:
    name: Scan packaged launchers for malware
    needs: [windows-launcher, linux-launcher, macos-launcher]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Desktop2Stereo-*-launcher-${{ github.sha }}
          path: dist

      - name: Install ClamAV
        run: sudo apt-get update && sudo apt-get install -y clamav clamav-freshclam

      - name: Update ClamAV signatures
        run: |
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          freshclam_log="$RUNNER_TEMP/freshclam.log"
          sudo freshclam --verbose --log="$freshclam_log"
          sudo cat "$freshclam_log"

      - name: Scan final release artifacts
        run: |
          find dist -type f -print0 | xargs -0 -r sudo clamscan --infected --no-summary
